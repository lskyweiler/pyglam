# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: build the dev version of the package
    cmds:
      - uv run maturin dev -r

  gen-stubs:
    desc: Generate py-stubs
    cmds:
      - cargo run --no-default-features --features=pyo3,numpy stub_gen
